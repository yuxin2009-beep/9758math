<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9758 H2 Mathematics | Interactive Teaching Portal</title>
  <style>
    :root {
      --bg: #fdfbf7;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #334155;
      --muted: #64748b;

      --purple: #8b5cf6;
      --purple-dark: #7c3aed;
      --purple-bg: #f3e8ff;

      --blue: #0284c7;
      --blue-bg: #e0f2fe;

      --teal: #0f766e;
      --teal-bg: #ccfbf1;

      --amber: #b45309;
      --amber-bg: #fef3c7;

      --rose: #e11d48;
      --rose-bg: #ffe4e6;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR NAVIGATION */
    .sidebar {
      width: 310px;
      background: #ffffff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }

    .brand-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #f5f3ff 0%, #ffffff 100%);
    }

    .brand-badge {
      display: inline-block;
      background: var(--purple);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .brand-header h1 {
      margin: 0;
      font-size: 1.15rem;
      color: #1e293b;
      line-height: 1.3;
    }

    .brand-header p {
      margin: 4px 0 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .nav-group {
      padding: 12px 14px 4px 14px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
    }

    .topic-btn {
      width: 100%;
      text-align: left;
      padding: 10px 18px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s;
      border-left: 3px solid transparent;
    }

    .topic-btn:hover {
      background: #f8fafc;
      color: var(--purple-dark);
    }

    .topic-btn.active {
      background: var(--purple-bg);
      color: var(--purple-dark);
      font-weight: 700;
      border-left-color: var(--purple-dark);
    }

    .status-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--teal-bg);
      color: var(--teal);
    }

    .status-pill.soon {
      background: #f1f5f9;
      color: #94a3b8;
    }

    /* MAIN WORKSPACE */
    .main-content {
      flex: 1;
      padding: 22px 28px;
      max-width: 1480px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .topic-title {
      margin: 0;
      font-size: 1.45rem;
      color: #1e293b;
    }

    .syllabus-note {
      margin: 5px 0 0 0;
      font-size: 0.83rem;
      color: var(--muted);
      max-width: 900px;
      line-height: 1.45;
    }

    .lesson-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .lesson-tab {
      padding: 9px 15px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .lesson-tab:hover {
      border-color: var(--purple);
      color: var(--purple-dark);
    }

    .lesson-tab.active {
      background: var(--purple);
      color: #ffffff;
      border-color: var(--purple-dark);
      box-shadow: 0 3px 10px rgba(139, 92, 246, 0.22);
    }

    /* TEACHER BRIEFING & PEDAGOGY GRID */
    .pedagogy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 1024px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
      }
      .pedagogy-grid {
        grid-template-columns: 1fr;
      }
    }

    .info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 3px 10px rgba(148, 163, 184, 0.06);
    }

    .card-kicker {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }

    .info-card ul {
      margin: 6px 0 0 0;
      padding-left: 18px;
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .info-card li {
      margin-bottom: 4px;
    }

    .gc-callout {
      margin-top: 10px;
      background: var(--blue-bg);
      border-left: 4px solid var(--blue);
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 0.81rem;
      color: #0c4a6e;
    }

    /* FULL-WIDTH LESSON VIDEO SECTION (BEFORE INTERACTIVE) */
    .video-section {
      width: 100%;
      background: var(--panel);
      border: 1.5px solid #d8b4fe;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.08);
      margin-bottom: 22px;
    }

    .video-toolbar {
      background: linear-gradient(90deg, #f3e8ff 0%, #faf5ff 100%);
      padding: 11px 18px;
      border-bottom: 1px solid #e9d5ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .video-badge {
      background: var(--purple-dark);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 46%;
      background: #0f172a;
    }

    .video-frame-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-placeholder-banner {
      width: 100%;
      padding: 36px 24px;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #4c1d95 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .play-icon-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: #ffffff;
    }

    /* INTERACTIVE EMBED FRAME */
    .interactive-wrapper {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(148, 163, 184, 0.09);
      margin-bottom: 20px;
    }

    .interactive-toolbar {
      background: #f8fafc;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .open-tab-link {
      text-decoration: none;
      background: var(--purple-bg);
      color: var(--purple-dark);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid #d8b4fe;
    }

    .open-tab-link:hover {
      background: var(--purple);
      color: #ffffff;
    }

    .interactive-iframe {
      width: 100%;
      height: 690px;
      border: none;
      display: block;
      background: #fdfbf7;
    }

    /* EXAM PRACTICE & EXIT TICKET */
    .exam-section {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
    }

    @media (max-width: 1024px) {
      .exam-section {
        grid-template-columns: 1fr;
      }
    }

    .reveal-btn {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--teal);
      background: var(--teal-bg);
      color: var(--teal);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .reveal-btn:hover {
      background: var(--teal);
      color: #ffffff;
    }

    .solution-box {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.84rem;
      line-height: 1.55;
    }

    .placeholder-banner {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 40px 24px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>

              <strong>(ii)</strong> Hence deduce the exact set of values of <em>x</em> for which <em>(2|x| − 1)/(|x| + 2) ≤ (|x| + 1)/(|x| − 1)</em>. [3]
            `,
            workedSolution: `
              <strong>(i)</strong> Bring all terms to one side (never cross-multiply):<br>
              <em>(2x − 1)/(x + 2) − (x + 1)/(x − 1) ≤ 0</em><br>
              <em>[(2x − 1)(x − 1) − (x + 1)(x + 2)] / [(x + 2)(x − 1)] ≤ 0</em><br>
              <em>(x² − 6x − 1) / [(x + 2)(x − 1)] ≤ 0</em>.<br>
              Numerator roots: <em>x = 3 ± √10</em> (note: <em>3 − √10 ≈ −0.16</em>, <em>3 + √10 ≈ 6.16</em>).<br>
              Denominator critical values (excluded): <em>x = −2, x = 1</em>.<br>
              Sign pattern across intervals: <strong>+ | − | + | − | +</strong>.<br>
              Hence <strong>−2 &lt; x ≤ 3 − √10</strong> or <strong>1 &lt; x ≤ 3 + √10</strong>.<br><br>
              <strong>(ii)</strong> Replace <em>x</em> with <em>|x|</em> in part (i):<br>
              • <em>−2 &lt; |x| ≤ 3 − √10</em>: impossible since <em>|x| ≥ 0</em> and <em>3 − √10 &lt; 0</em>.<br>
              • <em>1 &lt; |x| ≤ 3 + √10</em> ⇒ <strong>−(3 + √10) ≤ x &lt; −1</strong> or <strong>1 &lt; x ≤ 3 + √10</strong>.
            `,
            exitQuestion: "Solve (x − 3)/(x + 1) ≥ 0 algebraically.",
            exitAnswer: "Critical values are x = −1 (excluded) and x = 3 (included). Sign chart gives <strong>x &lt; −1 or x ≥ 3</strong>."
          },
          {

              <strong>(i)</strong> Since both sides are non-negative, square both sides:<br>

              <strong>(i)</strong> Let <em>x, y, z</em> be the number of notebooks, pens, and folders purchased respectively (where <em>x, y, z ∈ ℤ⁺</em>).<br>
              <em>x + y + z = 20</em><br>
              <em>6x + 2y + 5z = 95</em><br><br>
              <strong>(ii)</strong> Using a GC Simultaneous Equation Solver (Equations = 2, Unknowns = 3) with <em>z = k</em> (<em>k ∈ ℤ⁺</em>):<br>
              <em>x = (55 − 3k)/4</em> &nbsp;and&nbsp; <em>y = (25 − k)/4</em>.<br>
              Since <em>x ≥ 1, y ≥ 1, z ≥ 1</em>:<br>

              • <em>(25 − k)/4 ≥ 1 ⇒ k ≤ 21</em><br>
              • <em>k ≥ 1</em><br>
              Hence <em>1 ≤ k ≤ 17</em>. For <em>x, y</em> to be integers, <em>25 − k</em> must be divisible by 4, giving <strong>k = 1, 5, 9, 13, 17</strong>:<br>

    let currentTopic = "1.1";
    let currentLessonIdx = 0;

    function selectTopic(topicId) {
      currentTopic = topicId;
      currentLessonIdx = 0;
      document.querySelectorAll(".topic-btn").forEach(btn => btn.classList.remove("active"));
      const navEl = document.getElementById("nav_" + topicId);
      if (navEl) navEl.classList.add("active");
      renderWorkspace();
    }

    function selectLesson(idx) {
      currentLessonIdx = idx;
      renderWorkspace();
    }

    function toggleSolution(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.display = el.style.display === "block" ? "none" : "block";
    }

    function renderWorkspace() {
      const main = document.getElementById("mainWorkspace");
      const topic = curriculumData[currentTopic];

      if (!topic) {
        main.innerHTML = `
          <div class="placeholder-banner">
            <h2 style="color:#1e293b; margin-top:0;">Topic ${currentTopic} Module Coming Soon</h2>
            <p>Select <strong>1.1 Functions</strong>, <strong>1.2 Graphs &amp; Transformations</strong>, or <strong>1.3 Equations &amp; Inequalities</strong> from the sidebar to launch the interactive lessons.</p>
          </div>
        `;
        return;
      }

      const lesson = topic.lessons[currentLessonIdx];

      const tabsHtml = topic.lessons.map((les, idx) => `
        <button class="lesson-tab ${idx === currentLessonIdx ? "active" : ""}" onclick="selectLesson(${idx})">
          ${les.label}
        </button>
      `).join("");

              </div>
              <span style="font-size:0.78rem; color:#6b21a8; font-weight:600;">Watch before exploring the interactive lab below</span>
            </div>
            <div class="video-frame-wrap">
              <iframe src="${lesson.videoEmbedUrl}" title="${lesson.label} Video" allowfullscreen></iframe>
            </div>
          </section>
        `
        : `
          <section class="video-section">
            <div class="video-toolbar">
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="video-badge">Step 1 &bull; Concept Video</span>
                <strong style="font-size:0.92rem; color:#1e293b;">${lesson.label} — Video Walkthrough</strong>
              </div>
              <span style="font-size:0.78rem; color:#6b21a8; font-weight:600;">Full-Width Video Player Ready</span>
            </div>
            <div class="video-placeholder-banner">
              <div class="play-icon-circle">&#9654;</div>
              <div style="font-size:1.05rem; font-weight:800;">Lesson Video Placeholder: ${lesson.label}</div>

                Paste your YouTube, Vimeo, or Google Drive embed URL into <code>videoEmbedUrl</code> for this lesson to display the full-width video walkthrough right here before the interactive lab.
              </div>
            </div>
          </section>
        `;

      main.innerHTML = `
        <div class="top-bar">
          <div>
            <h2 class="topic-title">${topic.title}</h2>
            <p class="syllabus-note"><strong>9758 Syllabus Scope:</strong> ${topic.syllabusNotes}</p>
          </div>
        </div>

        <div class="lesson-tabs">${tabsHtml}</div>

        <!-- TEACHER & STUDENT BRIEFING -->

            <span class="card-kicker" style="color:var(--purple-dark);">Lesson Objectives &amp; Prerequisites</span>
